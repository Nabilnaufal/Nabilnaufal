name: Update WakaTime stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check stats freshness
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          auth=$(printf '%s' "$WAKATIME_API_KEY" | base64 -w0)
          api=https://api.wakatime.com/api/v1
          curl -sS -o /tmp/sb.json -H "Authorization: Basic $auth" "$api/users/current/statusbar/today"
          echo "statusbar today: $(jq -c '.data | {total: .grand_total.total_seconds, langs: [.languages[]? | {name,total_seconds}]}' /tmp/sb.json)"
          curl -sS -o /tmp/me.json -H "Authorization: Basic $auth" "$api/users/current"
          echo "user: $(jq -c '.data | {username,id,created_at,plan,timezone}' /tmp/me.json)"
          echo "user bools: $(jq -c '.data | with_entries(select(.value|type=="boolean"))' /tmp/me.json)"
          echo "user keys: $(jq -c '.data | keys' /tmp/me.json)"
          for r in last_7_days all_time; do
            curl -sS -o /tmp/st-$r.json -H "Authorization: Basic $auth" "$api/users/current/stats/$r"
            echo "$r: $(jq -c '.data | {total_seconds, categories: [.categories[]? | {name,total_seconds}], projects: [.projects[]? | {name,total_seconds}]}' /tmp/st-$r.json)"
          done
          curl -sS -o /tmp/sum.json -H "Authorization: Basic $auth" "$api/users/current/summaries?start=2026-11-10&end=2026-11-17"
          echo "summaries: $(jq -c '[.data[]? | {date: .range.date, total: .grand_total.total_seconds, langs: [.languages[]? | {name,total_seconds}]}]' /tmp/sum.json)"
          curl -sS -o /tmp/att.json -H "Authorization: Basic $auth" "$api/users/current/all_time_since_today"
          echo "all_time_since_today: $(jq -c '.data | {total_seconds, text, start: .range.start_date, end: .range.end_date}' /tmp/att.json)"
          python3 - <<'PY'
          import os, json, base64, urllib.request, datetime
          auth = base64.b64encode(os.environ['WAKATIME_API_KEY'].encode()).decode()
          api = 'https://api.wakatime.com/api/v1'
          start, end = datetime.date(2026, 7, 15), datetime.date(2026, 11, 17)
          totals, total_all = {}, 0.0
          while start <= end:
              chunk_end = min(start + datetime.timedelta(days=13), end)
              url = f'{api}/users/current/summaries?start={start}&end={chunk_end}'
              req = urllib.request.Request(url, headers={'Authorization': 'Basic ' + auth})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = json.load(r)
              for day in data.get('data') or []:
                  total_all += (day.get('grand_total') or {}).get('total_seconds') or 0
                  for lang in day.get('languages') or []:
                      totals[lang['name']] = totals.get(lang['name'], 0) + lang.get('total_seconds', 0)
              start = chunk_end + datetime.timedelta(days=1)
          print('summaries total:', round(total_all, 1))
          print('summaries langs:', sorted(((k, round(v, 1)) for k, v in totals.items()), key=lambda x: -x[1]))
          PY
          curl -sS -o /tmp/hb.json -H "Authorization: Basic $auth" "$api/users/current/heartbeats?date=2026-11-13"
          echo "hb sample: $(jq -c '.data[0] | {language,category,entity,time,is_write,user_agent}' /tmp/hb.json)"

      - name: Render WakaTime stats
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/waka_readme.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update WakaTime stats"
          git push
