name: Update WakaTime stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check stats freshness
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          for range in last_7_days last_year all_time; do
            code=$(curl -sS -o /tmp/waka-$range.json -w '%{http_code}' \
              -H "Authorization: Basic $(printf '%s' "$WAKATIME_API_KEY" | base64 -w0)" \
              "https://wakatime.com/api/v1/users/current/stats/$range")
            echo "$range http=$code up_to_date=$(jq -r '.data.is_up_to_date' /tmp/waka-$range.json)"
            jq -r '.data.languages[]? | "  \(.name) \(.total_seconds)"' /tmp/waka-$range.json | head -6
          done
          auth=$(printf '%s' "$WAKATIME_API_KEY" | base64 -w0)
          echo "oauth user: $(curl -sS -H "Authorization: Basic $auth" https://wakatime.com/api/v1/users/current | jq -r '.data.username')"
          day=$(TZ=Asia/Jakarta date +%F)
          curl -sS -o /tmp/waka-hb.json -H "Authorization: Basic $auth" "https://wakatime.com/api/v1/users/current/heartbeats?date=$day"
          echo "heartbeats $day: $(jq '.data | length' /tmp/waka-hb.json)"
          jq -r '.data[0:3][]? | "  \(.time) \(.language) \(.entity)"' /tmp/waka-hb.json
          for d in 2026-08-20 2026-11-13 2026-11-09; do
            curl -sS -o /tmp/waka-hb-$d.json -H "Authorization: Basic $auth" "https://wakatime.com/api/v1/users/current/heartbeats?date=$d"
            echo "heartbeats $d: $(jq '.data | length' /tmp/waka-hb-$d.json)"
          done
          echo "all_time keys: $(jq -c '.data | keys' /tmp/waka-all_time.json)"
          head -c 400 /tmp/waka-all_time.json

      - name: Render WakaTime stats
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/waka_readme.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update WakaTime stats"
          git push
